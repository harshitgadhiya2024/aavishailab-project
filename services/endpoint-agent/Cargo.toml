[package]
name = "aavishield-agent"
version = "1.0.0"
edition = "2021"

[lib]
name = "aavishield_agent"
path = "src/lib.rs"

[[bin]]
name = "aavishield-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "fs", "signal", "process"] }
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
base64 = "0.22"
tempfile = "3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
directories = "5"
rand = "0.8"
time = { version = "0.3", features = ["parsing", "formatting"] }

# ── Desktop UI ──────────────────────────────────────────────────────────────
# Native rendering (eframe/egui), not a webview: wry/tao would mean three
# different rendering engines across platforms (WebView2, WKWebView,
# WebKitGTK), each with its own startup cost, memory footprint, and quirks —
# and WebKitGTK specifically is a system package Linux desktop isn't
# guaranteed to have installed, an outage source that scales with fleet size.
# egui renders identically everywhere via wgpu/glow, ships as part of the
# binary, and starts instantly.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
tray-icon = "0.25"
# "webp" adds image-webp, a pure-Rust encoder — no libwebp system dependency,
# consistent with why egui was chosen over a webview. It is lossless-only
# (Python's mss/PIL path encodes lossy, quality=55): a full desktop capture
# lands well over Python's ~150KB target. Acceptable for now — screenshots
# are still small relative to a modern link — and worth a lossy pure-Rust
# encoder if upload volume ever makes it not be.
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# Screen capture. Pure Rust, no libwebp/libjpeg-style system dependency on
# any of the three platforms — same reasoning as the webview-vs-egui and
# WebP choices above: one fewer thing that can be missing on a machine this
# agent doesn't control the image for.
xcap = "0.6"
# Global keyboard/mouse/scroll listener for the activity percentage shown
# beside each screenshot. Counts events only — see activity_monitor.rs for
# why no key content is ever read, the same guarantee Python's pynput path
# makes.
rdev = "0.5"

# Linux only: tray-icon's Linux backend goes through libappindicator/GTK,
# which — unlike winit, the GUI toolkit itself — does not initialize
# itself. Without an explicit gtk::init() plus periodically pumping its
# main loop alongside winit's own, tray-icon panics the instant it touches
# GTK ("GTK has not been initialized"), caught by actually running this
# binary rather than by it merely compiling. Pinned to the same 0.18
# series tray-icon's own gtk3 feature already pulls in, so there is one
# copy of the crate in the dependency tree, not two.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
