[package]
name = "dlp-service"
version = "1.0.0"
edition = "2021"

[lib]
name = "dlp_service"
path = "src/lib.rs"

[[bin]]
name = "dlp-service"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "process", "sync", "io-util", "time"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
opentelemetry = "0.32.0"
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
opentelemetry-http = "0.32.0"
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-client"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "experimental_trace_batch_span_processor_with_async_runtime"] }
psl = "2"
form_urlencoded = "1"
reqwest = { version = "0.13", features = ["json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
zip = "2"
quick-xml = "0.36"
flate2 = "1"
tar = "0.4"
cfb = "0.10"
mail-parser = "0.9"
encoding_rs = "0.8"
chardetng = "0.1"
memmap2 = "0.9"
tempfile = "3"
hex = "0.4"
futures-util = "0.3"
wait-timeout = "0.2"
sevenz-rust2 = "0.23.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
pdfium-render = "0.9.4"

[dev-dependencies]
http-body-util = "0.1"
image = { version = "0.25", default-features = false, features = ["png"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
