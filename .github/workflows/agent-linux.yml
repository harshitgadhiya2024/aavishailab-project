name: Agent — Linux

# Builds, signs and releases the Linux connector (.deb) — and nothing else.
# Each platform has its own workflow and its own version line
# (agent-macos.yml, agent-windows.yml, agent-linux.yml), so a change for one
# platform never rebuilds or re-signs the other two. admin-api keeps one
# version per platform and offers each device the release for its own OS.
#
# The connector is one shared Rust codebase (services/endpoint-agent): a
# change outside platform-specific code reaches Linux devices only when
# this workflow is run.
#
# Packages move between jobs through Cloudflare R2, not GitHub artifacts
# (the account's artifact storage quota blocked every upload):
#
#   <root>/staging/linux/<version>/<run id>/   the build job stages here
#   <root>/releases/linux/<version>/           publish copies here once live
#
# packaging/ci/check-release.sh and publish-release.sh hold the logic the
# three workflows share.
#
# Triggers: "Run workflow" with a version, or pushing a tag
# agent-linux-v<version>.

on:
  push:
    tags: ["agent-linux-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Linux version (e.g. 2.9.6) — must be newer than the current Linux release"
        required: true

# Two releases of the same platform must not race each other's version check.
concurrency:
  group: agent-linux-release
  cancel-in-progress: false

# R2 is S3-compatible; every job talks to it with the runner's AWS CLI.
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # Newer AWS CLIs send checksum headers on every request by default;
  # only send them when the API requires it, which is all R2 accepts.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
  # The bucket is shared with another application; everything this
  # workflow writes stays under this prefix.
  R2_ROOT: ${{ vars.R2_PREFIX || 'aavishield' }}/agent-packages

jobs:
  # Resolves the version once, from the input or the tag, and fails before
  # any build time is spent on a version that is malformed, already
  # released, or older than the latest Linux release.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#agent-linux-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check version against published releases
        run: bash packaging/ci/check-release.sh linux "${{ steps.resolve.outputs.version }}"

  build:
    needs: resolve
    # NOT ubuntu-22.04 (oldest glibc) — tried that first and it
    # doesn't build: xcap's PipeWire/Wayland-portal backend (via the
    # `libspa`/`pipewire-sys` crates) generates its Rust bindings from
    # whatever PipeWire C headers are on the build machine at compile time,
    # not purely from the pinned crate version, and jammy's PipeWire
    # (~0.3.48) predates a struct field (`spa_video_info_raw::flags`)
    # `libspa` 0.8.0's hand-written wrapper code assumes exists — a real,
    # first-CI-run failure, not a hypothetical one:
    # "error[E0609]: no field `flags` on type `spa_video_info_raw`".
    # ubuntu-24.04 ships a new enough PipeWire; this does mean giving up
    # the "oldest glibc for max compat" property specifically
    # for this dependency chain — an unavoidable trade for depending on
    # xcap's Wayland backend at all. It does not weaken the resulting
    # .deb's own portability claim: dpkg-shlibdeps (below) still computes
    # Depends: honestly from whatever this machine actually links against,
    # so the package will correctly require the newer libpipewire-0.3-0 it
    # now legitimately needs, rather than silently under-declaring it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The connector's GUI/tray/screen-capture stack (eframe, tray-icon,
      # xcap) needs these to build at all — the same set
      # Dockerfile.build and ci.yml's rust-test-endpoint-agent job install,
      # plus dpkg-dev for dpkg-shlibdeps (build-rust.sh's automatic
      # Depends: computation — see that script's own comment for the real
      # bug it exists to catch).
      - name: Install desktop-UI and packaging system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libxdo-dev libpipewire-0.3-dev libdbus-1-dev \
            libclang-dev clang libgbm-dev libegl1-mesa-dev \
            dpkg-dev fakeroot

      - name: Build .deb
        env:
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        run: bash packaging/linux/build-rust.sh "${{ needs.resolve.outputs.version }}"

      - name: Stage to R2
        env:
          STAGE_URI: s3://${{ env.R2_BUCKET }}/${{ env.R2_ROOT }}/staging/linux/${{ needs.resolve.outputs.version }}/${{ github.run_id }}
        run: bash packaging/ci/stage-to-r2.sh dist/aavishield-agent-*.deb dist/aavishield-agent-*.tar.gz

  # Only after the build succeeded: verifies the staged package, releases it
  # to R2 and publishes it to admin-api, which moves only the Linux version.
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          AAVISHIELD_ADMIN_URL: ${{ secrets.AAVISHIELD_ADMIN_URL }}
          AGENT_PACKAGE_UPLOAD_TOKEN: ${{ secrets.AGENT_PACKAGE_UPLOAD_TOKEN }}
        run: bash packaging/ci/publish-release.sh linux "${{ needs.resolve.outputs.version }}" "${{ github.run_id }}"
