name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: go test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-api
          - threatintel-service
          - posture-service
          - shadowit-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: go vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...
      - name: go test -race
        working-directory: services/${{ matrix.service }}
        run: go test ./... -race -count=1

  rust-test:
    name: cargo test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - dlp-service-rust
          - malware-service-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: services/${{ matrix.service }}
        run: cargo test

  # A separate job, not folded into the matrix above: the connector's native
  # desktop window, tray icon and screen capture (eframe/egui, tray-icon,
  # xcap) link against real system libraries — GTK3/libappindicator for the
  # tray, libxkbcommon-x11 for winit's X11 backend, PipeWire/D-Bus for
  # xcap's Wayland portal — that dlp-service-rust and malware-service-rust
  # don't need. This had no CI coverage at all before now; a change here
  # could break and nobody would notice until packaging.
  rust-test-endpoint-agent:
    name: cargo test (endpoint-agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install desktop-UI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libxdo-dev libpipewire-0.3-dev libdbus-1-dev \
            libclang-dev clang libgbm-dev libegl1-mesa-dev
      - name: cargo clippy
        working-directory: services/endpoint-agent
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test
        working-directory: services/endpoint-agent
        run: cargo test

  python-test:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - malware-service
          - casb-service
          - ai-service
          # Deep content extraction (documents/archives/images+OCR) feeding
          # the DLP detector pipeline. Python/FastAPI; see its README.
          - extract-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # extract-service's OCR tests shell out to the real tesseract binary
      # (matching its Dockerfile), so the runner needs it installed.
      - name: Install tesseract (extract-service only)
        if: matrix.service == 'extract-service'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-hin
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: pytest
        working-directory: services/${{ matrix.service }}
        run: python -m pytest tests/ -v

  agent-test:
    name: pytest (endpoint agent)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: scripts/agent
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt
      - name: pytest
        working-directory: scripts/agent
        run: python -m pytest tests/ -v

  frontend-build:
    name: next build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - superadmin
          - company-dashboard
          - employee-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: npm ci
        working-directory: frontend/${{ matrix.app }}
        run: npm ci --legacy-peer-deps
      - name: next build
        working-directory: frontend/${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.invalid
          NEXT_PUBLIC_WS_URL: wss://placeholder.invalid
          NEXT_PUBLIC_AI_URL: https://placeholder.invalid
        run: npm run build
