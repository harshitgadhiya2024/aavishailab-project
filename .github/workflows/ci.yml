name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    name: go test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - admin-api
          - threatintel-service
          - posture-service
          - shadowit-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/${{ matrix.service }}/go.sum
      - name: go vet
        working-directory: services/${{ matrix.service }}
        run: go vet ./...
      - name: go test -race
        working-directory: services/${{ matrix.service }}
        run: go test ./... -race -count=1

  python-test:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - dlp-service
          - malware-service
          - casb-service
          - ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: pytest
        working-directory: services/${{ matrix.service }}
        run: python -m pytest tests/ -v

  frontend-build:
    name: next build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - superadmin
          - company-dashboard
          - employee-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: npm ci
        working-directory: frontend/${{ matrix.app }}
        run: npm ci --legacy-peer-deps
      - name: next build
        working-directory: frontend/${{ matrix.app }}
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.invalid
          NEXT_PUBLIC_WS_URL: wss://placeholder.invalid
          NEXT_PUBLIC_AI_URL: https://placeholder.invalid
        run: npm run build
