name: Agent — macOS

# Builds, signs and releases the macOS connector (.pkg) — and nothing else.
# Each platform has its own workflow and its own version line
# (agent-macos.yml, agent-windows.yml, agent-linux.yml), so a change for one
# platform never rebuilds or re-signs the other two. admin-api keeps one
# version per platform and offers each device the release for its own OS.
#
# The connector is one shared Rust codebase (services/endpoint-agent): a
# change outside platform-specific code reaches macOS devices only when
# this workflow is run.
#
# Every macOS release reaches the fleet on its own: Macs auto-update to it
# within about an hour (update.rs). Run this only to ship a Mac change.
#
# Packages move between jobs through Cloudflare R2, not GitHub artifacts
# (the account's artifact storage quota blocked every upload):
#
#   <root>/staging/macos/<version>/<run id>/   the build job stages here
#   <root>/releases/macos/<version>/           publish copies here once live
#
# packaging/ci/check-release.sh and publish-release.sh hold the logic the
# three workflows share.
#
# Triggers: "Run workflow" with a version, or pushing a tag
# agent-macos-v<version>.

on:
  push:
    tags: ["agent-macos-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "macOS version (e.g. 2.9.6) — must be newer than the current macOS release"
        required: true

# Two releases of the same platform must not race each other's version check.
concurrency:
  group: agent-macos-release
  cancel-in-progress: false

# R2 is S3-compatible; every job talks to it with the runner's AWS CLI.
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # Newer AWS CLIs send checksum headers on every request by default;
  # only send them when the API requires it, which is all R2 accepts.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
  # The bucket is shared with another application; everything this
  # workflow writes stays under this prefix.
  R2_ROOT: ${{ vars.R2_PREFIX || 'aavishield' }}/agent-packages

jobs:
  # Resolves the version once, from the input or the tag, and fails before
  # any build time is spent on a version that is malformed, already
  # released, or older than the latest macOS release.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#agent-macos-v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Check version against published releases
        run: bash packaging/ci/check-release.sh macos "${{ steps.resolve.outputs.version }}"

  build:
    needs: resolve
    runs-on: macos-14 # Apple Silicon only — see packaging/macos/build-rust.sh's own note
    # Job-level, not step-level: a step's `if:` can't see that same step's
    # own `env:`, so the old per-step gate always read empty and skipped.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Apple hands out the Application and Installer identities as two
      # separate certificates; MACOS_INSTALLER_CERT_P12 is optional for when
      # both were exported into the one MACOS_CERT_P12.
      - name: Import signing certificates
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          for var in MACOS_CERT_P12 MACOS_INSTALLER_CERT_P12; do
            [[ -n "${!var}" ]] || continue
            echo "${!var}" | base64 --decode > /tmp/cert.p12
            security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm /tmp/cert.p12
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          security find-identity -v build.keychain

      # build-rust.sh notarizes against a keychain profile, and a fresh
      # runner has none — create it here from the Apple ID credentials.
      - name: Store notarization credentials
        if: env.APPLE_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials aavishield \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=aavishield" >> "$GITHUB_ENV"

      - name: Build .pkg
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        run: bash packaging/macos/build-rust.sh "${{ needs.resolve.outputs.version }}"

      - name: Stage to R2
        env:
          STAGE_URI: s3://${{ env.R2_BUCKET }}/${{ env.R2_ROOT }}/staging/macos/${{ needs.resolve.outputs.version }}/${{ github.run_id }}
        run: bash packaging/ci/stage-to-r2.sh dist/aavishield-agent-*.pkg

  # Only after the build succeeded: verifies the staged package, releases it
  # to R2 and publishes it to admin-api, which moves only the macOS version.
  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          AAVISHIELD_ADMIN_URL: ${{ secrets.AAVISHIELD_ADMIN_URL }}
          AGENT_PACKAGE_UPLOAD_TOKEN: ${{ secrets.AGENT_PACKAGE_UPLOAD_TOKEN }}
        run: bash packaging/ci/publish-release.sh macos "${{ needs.resolve.outputs.version }}" "${{ github.run_id }}"
