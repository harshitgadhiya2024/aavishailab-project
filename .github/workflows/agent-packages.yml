name: Agent packages

# Native installers have to be built on their own OS — PyInstaller freezes the
# host's interpreter, and codesign/signtool only exist on macOS/Windows. Hence
# one job per platform rather than a cross-compile.
#
# Two tracks: the Python connector (macos/windows/linux/manifest — unchanged
# below except for the version fix) is what real employees download today.
# The Rust connector (macos-rust/windows-rust/linux-rust/rust-manifest) is
# built and uploaded as CI artifacts alongside it, but deliberately never
# reaches "Publish to production" — see rust-manifest's own comment for why
# promoting it to the live download is a separate decision (Phase 6 in
# REQUIREMENT_AUDIT_AND_PLAN.md), not something this workflow makes on its
# own the day the packaging happens to work.

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Agent version (e.g. 1.1.0)"
        required: true
        default: "1.1.0"

jobs:
  # Computes VERSION exactly once so every other job reads the same value
  # instead of each repeating its own `inputs.version || '1.1.0'` fallback.
  # That per-job fallback was a real bug: it only ever mattered for the tag-
  # push trigger (workflow_dispatch's `version` is `required: true`, so
  # `inputs.version` is never empty on that path) — but a tag push read no
  # information from the tag at all and would have silently published every
  # release as "1.1.0" forever, one version below whatever was actually
  # live, had anyone ever used `git push --tags` instead of
  # workflow_dispatch to trigger this. Fixed by deriving the version from
  # the tag itself (stripping the `agent-v` prefix) on that path, and
  # failing loudly instead of falling back to a stale constant on either
  # path.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # A tag push: "agent-v2.6.0" -> "2.6.0".
            VERSION="${GITHUB_REF_NAME#agent-v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve a version from this trigger (event=${{ github.event_name }}, ref=${{ github.ref_name }})"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  macos:
    needs: resolve-version
    runs-on: macos-14 # Apple Silicon only — see the arm64-only note in the Build .pkg step
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so a build never silently changes what it produces, and
      # covers every optional feature (mss/pynput screen+activity capture,
      # cryptography for policy-signature verification) that the frozen
      # binary otherwise degrades away from without any visible error.
      - run: pip install -r scripts/agent/requirements-build.txt

      # Signing secrets are optional: without them the job still produces an
      # unsigned .pkg so the pipeline is testable before certs exist.
      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm /tmp/cert.p12

      - name: Build .pkg
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          # Baked into the binary: the package carries no employee-specific
          # token, so the agent has to already know where to enrol.
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
          # KNOWN GAP: macos-14 is Apple Silicon only, and this produces an
          # arm64-only .pkg — it will not install on an Intel Mac. Tried
          # AAVISHIELD_TARGET_ARCH=universal2 here; PyInstaller's own
          # interpreter is universal2 but pip installs arch-specific wheels
          # for compiled deps (confirmed: Pillow's _imagingft.so came back
          # arm64-only and PyInstaller refused to proceed — "is not a fat
          # binary"). A real fix needs each dependency built/lipo-merged for
          # both arches, or two separate builds merged after the fact —
          # more than a one-line flag, and not verifiable without real
          # Intel Mac hardware to test the result on.
        run: bash packaging/macos/build.sh "${{ needs.resolve-version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg
          path: dist/*.pkg

  windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so a build never silently changes what it produces, and
      # covers every optional feature (mss/pynput screen+activity capture,
      # cryptography for policy-signature verification) that the frozen
      # binary otherwise degrades away from without any visible error.
      - run: pip install -r scripts/agent/requirements-build.txt
      - run: choco install wixtoolset --no-progress -y
      - run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      # SIGNING_CERT_PFX_B64 (the secret) holds the .pfx file's bytes,
      # base64-encoded — a secret can't hold a filesystem path that would mean
      # anything on a fresh runner. Decode it to an actual file here, the same
      # way the macOS job imports MACOS_CERT_P12 into a keychain, before
      # build.ps1 hands a real path to signtool. Thumbprint-based signing (an
      # already-installed machine cert) skips this — there's no file to decode.
      - name: Decode signing certificate
        if: env.SIGNING_CERT_PFX_B64 != ''
        env:
          SIGNING_CERT_PFX_B64: ${{ secrets.SIGNING_CERT_PFX_B64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGNING_CERT_PFX_B64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\aavishield-signing.pfx", $bytes)

      - name: Build .msi
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        run: |
          if (Test-Path "$env:RUNNER_TEMP\aavishield-signing.pfx") {
            $env:SIGNING_CERT_PFX = "$env:RUNNER_TEMP\aavishield-signing.pfx"
          }
          powershell -ExecutionPolicy Bypass -File packaging\windows\build.ps1 -Version "${{ needs.resolve-version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist/*.msi

  linux:
    needs: resolve-version
    runs-on: ubuntu-22.04 # oldest supported glibc — binaries built here run on newer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned so a build never silently changes what it produces, and
      # covers every optional feature (mss/pynput screen+activity capture,
      # cryptography for policy-signature verification) that the frozen
      # binary otherwise degrades away from without any visible error.
      - run: pip install -r scripts/agent/requirements-build.txt
      - name: Build .deb
        env:
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        run: bash packaging/linux/build.sh "${{ needs.resolve-version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: |
            dist/*.deb
            dist/*.tar.gz

  manifest:
    needs: [resolve-version, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      # Three explicit named downloads, not one no-filter merge-multiple:
      # this job must only ever see the Python connector's own three
      # artifacts. The Rust jobs below upload their own separately-named
      # artifacts in the same workflow run — an unfiltered download here
      # would silently sweep those in too, and "Publish to production"
      # below would then push an unverified Rust build to the same live
      # endpoint real employees download from.
      - uses: actions/download-artifact@v4
        with: { name: macos-pkg, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: windows-msi, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: linux-deb, path: dist }

      # Filenames only. admin-api computes every checksum from the bytes it
      # actually serves, so a hash written here could only ever go stale.
      - name: Write manifest.json
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          python3 - "$VERSION" <<'PY'
          import json, os, sys
          version = sys.argv[1]
          artifacts = {}
          for f in sorted(os.listdir("dist")):
              if f.endswith(".pkg"):
                  artifacts["macos"] = f
              elif f.endswith(".msi"):
                  artifacts["windows"] = f
              elif f.endswith(".deb"):
                  artifacts["linux"] = f
          json.dump({"version": version, "artifacts": artifacts},
                    open("dist/manifest.json", "w"), indent=2)
          print(json.dumps({"version": version, "artifacts": artifacts}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: agent-packages
          path: dist/

      # Pushes each built package to the running admin-api over its own
      # upload token (not portal/agent auth — this runner has neither
      # identity). Skipped entirely if the secret isn't set yet, so this
      # workflow stays usable for local testing before production is wired up.
      - name: Publish to production
        if: env.AAVISHIELD_ADMIN_URL != ''
        env:
          AAVISHIELD_ADMIN_URL: ${{ secrets.AAVISHIELD_ADMIN_URL }}
          AGENT_PACKAGE_UPLOAD_TOKEN: ${{ secrets.AGENT_PACKAGE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          for f in dist/*.pkg dist/*.msi dist/*.deb; do
            [ -e "$f" ] || continue
            case "$f" in
              *.pkg) platform=macos ;;
              *.msi) platform=windows ;;
              *.deb) platform=linux ;;
            esac
            echo "==> Publishing $f as $platform"
            curl -fsSL -X POST "$AAVISHIELD_ADMIN_URL/internal/admin/agent-packages" \
              -H "Authorization: Bearer $AGENT_PACKAGE_UPLOAD_TOKEN" \
              -F "platform=$platform" \
              -F "version=$VERSION" \
              -F "file=@$f"
            echo
          done

  # ─── Rust connector — built and uploaded as CI artifacts, never published
  # to production by this workflow. See this file's top-of-file comment.

  macos-rust:
    needs: resolve-version
    runs-on: macos-14 # Apple Silicon only — see packaging/macos/build-rust.sh's own note
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Import signing certificate
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          echo "$MACOS_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm /tmp/cert.p12

      - name: Build .pkg
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        run: bash packaging/macos/build-rust.sh "${{ needs.resolve-version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-rust-pkg
          path: dist/aavishield-agent-rust-*.pkg

  windows-rust:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install wixtoolset --no-progress -y
      - run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Decode signing certificate
        if: env.SIGNING_CERT_PFX_B64 != ''
        env:
          SIGNING_CERT_PFX_B64: ${{ secrets.SIGNING_CERT_PFX_B64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGNING_CERT_PFX_B64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\aavishield-signing.pfx", $bytes)

      - name: Build .msi
        env:
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        # This is the first time build-rust.ps1 has ever actually run — see
        # its own header comment. A real Windows runner is exactly the
        # verification this repo couldn't produce any other way; a failure
        # here is genuine signal, not noise to route around.
        run: |
          if (Test-Path "$env:RUNNER_TEMP\aavishield-signing.pfx") {
            $env:SIGNING_CERT_PFX = "$env:RUNNER_TEMP\aavishield-signing.pfx"
          }
          powershell -ExecutionPolicy Bypass -File packaging\windows\build-rust.ps1 -Version "${{ needs.resolve-version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-rust-msi
          path: dist/aavishield-agent-rust-*.msi

  linux-rust:
    needs: resolve-version
    runs-on: ubuntu-22.04 # oldest supported glibc — matches the Python job's own reasoning, and
                           # matters more here: dpkg-shlibdeps pins Depends: to what's on THIS
                           # machine, so building on an older base means a lower (more portable)
                           # minimum version requirement on the target.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The connector's GUI/tray/screen-capture stack (eframe, tray-icon,
      # xcap) needs these to build at all — the same set
      # Dockerfile.build and ci.yml's rust-test-endpoint-agent job install,
      # plus dpkg-dev for dpkg-shlibdeps (build-rust.sh's automatic
      # Depends: computation — see that script's own comment for the real
      # bug it exists to catch).
      - name: Install desktop-UI and packaging system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libxdo-dev libpipewire-0.3-dev libdbus-1-dev \
            libclang-dev clang libgbm-dev libegl1-mesa-dev \
            dpkg-dev fakeroot

      - name: Build .deb
        env:
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        run: bash packaging/linux/build-rust.sh "${{ needs.resolve-version.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-rust-deb
          path: |
            dist/aavishield-agent-rust-*.deb
            dist/aavishield-agent-rust-*.tar.gz

  rust-manifest:
    needs: [resolve-version, macos-rust, windows-rust, linux-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: macos-rust-pkg, path: dist-rust }
      - uses: actions/download-artifact@v4
        with: { name: windows-rust-msi, path: dist-rust }
      - uses: actions/download-artifact@v4
        with: { name: linux-rust-deb, path: dist-rust }

      - name: Write manifest-rust.json
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          python3 - "$VERSION" <<'PY'
          import json, os, sys
          version = sys.argv[1]
          artifacts = {}
          for f in sorted(os.listdir("dist-rust")):
              if f.endswith(".pkg"):
                  artifacts["macos"] = f
              elif f.endswith(".msi"):
                  artifacts["windows"] = f
              elif f.endswith(".deb"):
                  artifacts["linux"] = f
          json.dump({"version": version, "artifacts": artifacts},
                    open("dist-rust/manifest-rust.json", "w"), indent=2)
          print(json.dumps({"version": version, "artifacts": artifacts}, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: agent-packages-rust
          path: dist-rust/

      # Deliberately no "Publish to production" step here. Promoting the
      # Rust connector to what admin-api actually serves employees is
      # Phase 6 (see REQUIREMENT_AUDIT_AND_PLAN.md) — gated on real
      # interactive verification (does the window render correctly, does
      # the tray icon show, do the Screen Recording/Accessibility
      # permission prompts actually work) that a headless CI build cannot
      # provide even when it succeeds. A green build here proves the
      # package compiles, links and installs; it does not prove the GUI
      # behaves correctly on a Windows desktop nobody has watched it run
      # on. These artifacts are for manual download and testing until that
      # gate is met.
