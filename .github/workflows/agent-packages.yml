name: Agent packages

# Native installers have to be built on their own OS — the GUI/tray/screen-
# capture stack links each platform's native libraries, and codesign/signtool
# only exist on macOS/Windows. Hence one job per platform rather than a
# cross-compile.
#
# The Rust connector (services/endpoint-agent) is the only connector:
# `publish` pushes the macos-rust/windows-rust/linux-rust packages to
# admin-api — that is what NativePackageFor and the employee portal's
# download buttons serve. The Python connector it replaced has been
# removed; git history is the rollback path. One open gap: nobody has yet
# installed the real .msi and clicked through it on a Windows desktop.
#
# Packages move between jobs through Cloudflare R2, not GitHub artifacts
# (the account's artifact storage quota blocked every upload):
#
#   <root>/staging/<version>/<run id>/   each platform job stages here
#   <root>/releases/<version>/           publish copies here once live
#
# A release is all-or-nothing: `publish` needs all three platform jobs, so
# if any one fails nothing is published and the staged files stay put for
# inspection. releases/<version>/manifest.json is written last and marks a
# version as published — resolve-version refuses to build it again.

on:
  push:
    tags: ["agent-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Agent version (e.g. 1.1.0)"
        required: true
        default: "1.1.0"

# R2 is S3-compatible; every job talks to it with the runner's AWS CLI.
env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # Newer AWS CLIs send checksum headers on every request by default;
  # only send them when the API requires it, which is all R2 accepts.
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
  R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
  # The bucket is shared with another application; everything this
  # workflow writes stays under this prefix.
  R2_ROOT: ${{ vars.R2_PREFIX || 'aavishield' }}/agent-packages

jobs:
  # Computes VERSION exactly once so every other job reads the same value
  # instead of each repeating its own `inputs.version || '1.1.0'` fallback.
  # That per-job fallback was a real bug: it only ever mattered for the tag-
  # push trigger (workflow_dispatch's `version` is `required: true`, so
  # `inputs.version` is never empty on that path) — but a tag push read no
  # information from the tag at all and would have silently published every
  # release as "1.1.0" forever, one version below whatever was actually
  # live, had anyone ever used `git push --tags` instead of
  # workflow_dispatch to trigger this. Fixed by deriving the version from
  # the tag itself (stripping the `agent-v` prefix) on that path, and
  # failing loudly instead of falling back to a stale constant on either
  # path.
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # A tag push: "agent-v2.6.0" -> "2.6.0".
            VERSION="${GITHUB_REF_NAME#agent-v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "::error::could not resolve a version from this trigger (event=${{ github.event_name }}, ref=${{ github.ref_name }})"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version '$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      # Fails before ~15 minutes of builds rather than after: a version that
      # already has a release marker, or one older than the newest release,
      # would either overwrite what devices are running or move them
      # backwards. Rollback is the superadmin dashboard's job, not this one.
      - name: Check version against published releases
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          r2() { aws --endpoint-url "$R2_ENDPOINT_URL" "$@"; }
          if out=$(r2 s3api head-object --bucket "$R2_BUCKET" --key "$R2_ROOT/releases/$VERSION/manifest.json" 2>&1); then
            echo "::error::$VERSION is already published — bump the version"
            exit 1
          elif ! grep -qE "Not Found|404" <<<"$out"; then
            echo "::error::could not check R2 for an existing release: $out"
            exit 1
          fi
          latest=$(r2 s3 ls "s3://$R2_BUCKET/$R2_ROOT/releases/" | awk '$1=="PRE"{sub("/$","",$2); print $2}' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          if [ -n "$latest" ] && [ "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -1)" != "$VERSION" ]; then
            echo "::error::$VERSION is older than the latest release $latest"
            exit 1
          fi
          echo "Latest release: ${latest:-none}; building $VERSION"

  # Runs only when every platform job succeeded (the `needs` default), so a
  # failed build anywhere publishes nothing — not a partial release.
  publish:
    needs: [resolve-version, macos-rust, windows-rust, linux-rust]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Download and verify staged packages
        run: |
          set -euo pipefail
          r2() { aws --endpoint-url "$R2_ENDPOINT_URL" "$@"; }
          r2 s3 cp --recursive --only-show-errors \
            "s3://$R2_BUCKET/$R2_ROOT/staging/$VERSION/${{ github.run_id }}/" dist/
          cd dist
          ls -l
          for ext in pkg msi deb; do
            n=$(ls *."$ext" 2>/dev/null | wc -l)
            [ "$n" -eq 1 ] || { echo "::error::expected exactly one .$ext staged, found $n"; exit 1; }
          done
          # Proves the bytes about to go live are the bytes each build job
          # produced, not something truncated or swapped in R2 in between.
          cat *.sha256 | sha256sum --check --strict

      # Filenames only. admin-api computes every checksum from the bytes it
      # actually serves, so a hash written here could only ever go stale.
      - name: Write manifest.json
        run: |
          python3 - "$VERSION" <<'PY'
          import json, os, sys
          version = sys.argv[1]
          artifacts = {}
          for f in sorted(os.listdir("dist")):
              if f.endswith(".pkg"):
                  artifacts["macos"] = f
              elif f.endswith(".msi"):
                  artifacts["windows"] = f
              elif f.endswith(".deb"):
                  artifacts["linux"] = f
          json.dump({"version": version, "artifacts": artifacts},
                    open("dist/manifest.json", "w"), indent=2)
          print(json.dumps({"version": version, "artifacts": artifacts}, indent=2))
          PY

      # Files first, marker last: releases/<version>/ without a manifest.json
      # means a publish that didn't finish, and resolve-version lets that
      # same version be built again.
      - name: Copy to R2 releases
        run: |
          set -euo pipefail
          aws --endpoint-url "$R2_ENDPOINT_URL" s3 cp --recursive --only-show-errors \
            --exclude manifest.json dist/ "s3://$R2_BUCKET/$R2_ROOT/releases/$VERSION/"

      # Pushes each built package to the running admin-api over its own
      # upload token (not portal/agent auth — this runner has neither
      # identity).
      - name: Publish to production
        env:
          AAVISHIELD_ADMIN_URL: ${{ secrets.AAVISHIELD_ADMIN_URL }}
          AGENT_PACKAGE_UPLOAD_TOKEN: ${{ secrets.AGENT_PACKAGE_UPLOAD_TOKEN }}
        run: |
          set -euo pipefail
          for f in dist/*.pkg dist/*.msi dist/*.deb; do
            case "$f" in
              *.pkg) platform=macos ;;
              *.msi) platform=windows ;;
              *.deb) platform=linux ;;
            esac
            echo "==> Publishing $f as $platform"
            curl -fsSL --retry 3 --retry-all-errors -X POST "$AAVISHIELD_ADMIN_URL/internal/admin/agent-packages" \
              -H "Authorization: Bearer $AGENT_PACKAGE_UPLOAD_TOKEN" \
              -F "platform=$platform" \
              -F "version=$VERSION" \
              -F "file=@$f"
            echo
          done

      - name: Mark release published
        run: |
          set -euo pipefail
          r2() { aws --endpoint-url "$R2_ENDPOINT_URL" "$@"; }
          r2 s3 cp --only-show-errors dist/manifest.json "s3://$R2_BUCKET/$R2_ROOT/releases/$VERSION/manifest.json"
          r2 s3 rm --recursive --only-show-errors "s3://$R2_BUCKET/$R2_ROOT/staging/$VERSION/${{ github.run_id }}/"

  # ─── Per-platform builds — each stages to R2; `publish` above releases them.

  macos-rust:
    needs: resolve-version
    runs-on: macos-14 # Apple Silicon only — see packaging/macos/build-rust.sh's own note
    # Job-level, not step-level: a step's `if:` can't see that same step's
    # own `env:`, so the old per-step gate always read empty and skipped.
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_INSTALLER_CERT_P12: ${{ secrets.MACOS_INSTALLER_CERT_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # Apple hands out the Application and Installer identities as two
      # separate certificates; MACOS_INSTALLER_CERT_P12 is optional for when
      # both were exported into the one MACOS_CERT_P12.
      - name: Import signing certificates
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          for var in MACOS_CERT_P12 MACOS_INSTALLER_CERT_P12; do
            [[ -n "${!var}" ]] || continue
            echo "${!var}" | base64 --decode > /tmp/cert.p12
            security import /tmp/cert.p12 -k build.keychain -P "$MACOS_CERT_PASSWORD" \
              -T /usr/bin/codesign -T /usr/bin/productbuild
            rm /tmp/cert.p12
          done
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          security find-identity -v build.keychain

      # build-rust.sh notarizes against a keychain profile, and a fresh
      # runner has none — create it here from the Apple ID credentials.
      - name: Store notarization credentials
        if: env.APPLE_ID != ''
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials aavishield \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          echo "NOTARY_PROFILE=aavishield" >> "$GITHUB_ENV"

      - name: Build .pkg
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        run: bash packaging/macos/build-rust.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Stage to R2
        env:
          STAGE_URI: s3://${{ env.R2_BUCKET }}/${{ env.R2_ROOT }}/staging/${{ needs.resolve-version.outputs.version }}/${{ github.run_id }}
        run: bash packaging/ci/stage-to-r2.sh dist/aavishield-agent-rust-*.pkg

  windows-rust:
    needs: resolve-version
    runs-on: windows-latest
    env:
      ESIGNER_USERNAME: ${{ secrets.ESIGNER_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: choco install wixtoolset --no-progress -y
      - run: echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Decode signing certificate
        if: env.SIGNING_CERT_PFX_B64 != ''
        env:
          SIGNING_CERT_PFX_B64: ${{ secrets.SIGNING_CERT_PFX_B64 }}
        run: |
          $bytes = [Convert]::FromBase64String($env:SIGNING_CERT_PFX_B64)
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\aavishield-signing.pfx", $bytes)

      # SSL.com eSigner: the signing key lives in SSL.com's cloud, so there
      # is no .pfx — CodeSignTool signs remotely. Pinned by hash so a
      # changed download can't end up signing our binaries.
      - uses: actions/setup-java@v4
        if: env.ESIGNER_USERNAME != ''
        with: { distribution: temurin, java-version: "17" }
      - name: Fetch CodeSignTool
        if: env.ESIGNER_USERNAME != ''
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o "$RUNNER_TEMP/cst.zip" \
            https://github.com/SSLcom/CodeSignTool/releases/download/v1.3.2/CodeSignTool-v1.3.2.zip
          echo "f14b1e1ef14bfa1fd00279c363aab0debbf5dcfba0e4bcdce5d22bb771de0e3a  $RUNNER_TEMP/cst.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/cst.zip" -d "$RUNNER_TEMP/CodeSignTool"
          echo "CODESIGNTOOL_DIR=$RUNNER_TEMP\\CodeSignTool" >> "$GITHUB_ENV"

      - name: Build .msi
        env:
          ESIGNER_PASSWORD: ${{ secrets.ESIGNER_PASSWORD }}
          ESIGNER_CREDENTIAL_ID: ${{ secrets.ESIGNER_CREDENTIAL_ID }}
          ESIGNER_TOTP_SECRET: ${{ secrets.ESIGNER_TOTP_SECRET }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
          SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        # This is the first time build-rust.ps1 has ever actually run — see
        # its own header comment. A real Windows runner is exactly the
        # verification this repo couldn't produce any other way; a failure
        # here is genuine signal, not noise to route around.
        #
        # Invoked with `&`, not build.ps1's nested `powershell -File ...` —
        # that first real run hit a genuine, reproducible bug in the nested
        # form: this step already runs under pwsh (PowerShell 7), but
        # `powershell.exe` is legacy Windows PowerShell 5.1, a different
        # parser, and it threw "Missing closing '}'" against code that
        # parses cleanly everywhere else (verified independently against a
        # real PowerShell 7 parser). Calling the script directly keeps
        # everything on the one engine already running this step, and
        # sidesteps whatever legacy-parser incompatibility that was —
        # never conclusively isolated, since there is no PS 5.1 anywhere
        # this could be reproduced outside the runner itself.
        run: |
          if (Test-Path "$env:RUNNER_TEMP\aavishield-signing.pfx") {
            $env:SIGNING_CERT_PFX = "$env:RUNNER_TEMP\aavishield-signing.pfx"
          }
          & .\packaging\windows\build-rust.ps1 -Version "${{ needs.resolve-version.outputs.version }}"

      - name: Stage to R2
        shell: bash # Git Bash — same script as the other two platforms
        env:
          STAGE_URI: s3://${{ env.R2_BUCKET }}/${{ env.R2_ROOT }}/staging/${{ needs.resolve-version.outputs.version }}/${{ github.run_id }}
        run: bash packaging/ci/stage-to-r2.sh dist/aavishield-agent-rust-*.msi

  linux-rust:
    needs: resolve-version
    # NOT ubuntu-22.04 (oldest glibc) — tried that first and it
    # doesn't build: xcap's PipeWire/Wayland-portal backend (via the
    # `libspa`/`pipewire-sys` crates) generates its Rust bindings from
    # whatever PipeWire C headers are on the build machine at compile time,
    # not purely from the pinned crate version, and jammy's PipeWire
    # (~0.3.48) predates a struct field (`spa_video_info_raw::flags`)
    # `libspa` 0.8.0's hand-written wrapper code assumes exists — a real,
    # first-CI-run failure, not a hypothetical one:
    # "error[E0609]: no field `flags` on type `spa_video_info_raw`".
    # ubuntu-24.04 ships a new enough PipeWire; this does mean giving up
    # the "oldest glibc for max compat" property specifically
    # for this dependency chain — an unavoidable trade for depending on
    # xcap's Wayland backend at all. It does not weaken the resulting
    # .deb's own portability claim: dpkg-shlibdeps (below) still computes
    # Depends: honestly from whatever this machine actually links against,
    # so the package will correctly require the newer libpipewire-0.3-0 it
    # now legitimately needs, rather than silently under-declaring it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # The connector's GUI/tray/screen-capture stack (eframe, tray-icon,
      # xcap) needs these to build at all — the same set
      # Dockerfile.build and ci.yml's rust-test-endpoint-agent job install,
      # plus dpkg-dev for dpkg-shlibdeps (build-rust.sh's automatic
      # Depends: computation — see that script's own comment for the real
      # bug it exists to catch).
      - name: Install desktop-UI and packaging system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libgtk-3-dev libayatana-appindicator3-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libxdo-dev libpipewire-0.3-dev libdbus-1-dev \
            libclang-dev clang libgbm-dev libegl1-mesa-dev \
            dpkg-dev fakeroot

      - name: Build .deb
        env:
          AAVISHIELD_ADMIN_URL: ${{ vars.AAVISHIELD_ADMIN_URL }}
          AAVISHIELD_PORTAL_URL: ${{ vars.AAVISHIELD_PORTAL_URL }}
        run: bash packaging/linux/build-rust.sh "${{ needs.resolve-version.outputs.version }}"

      - name: Stage to R2
        env:
          STAGE_URI: s3://${{ env.R2_BUCKET }}/${{ env.R2_ROOT }}/staging/${{ needs.resolve-version.outputs.version }}/${{ github.run_id }}
        run: bash packaging/ci/stage-to-r2.sh dist/aavishield-agent-rust-*.deb dist/aavishield-agent-rust-*.tar.gz
