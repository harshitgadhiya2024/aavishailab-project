# clamd configuration for Aavishield.
#
# The stock defaults cap a stream at 25MB and a scanned file at 100MB, which
# silently turned every real-world installer download into an unscanned one.
# Everything below is raised to clamd's protocol ceiling (sizes are stored in a
# 32-bit field, so 4GB is the hard maximum — larger files are still hashed and
# heuristically analysed by malware-service, just not signature-scanned).

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# ─── Size limits ─────────────────────────────────────────────────────────────
StreamMaxLength 4000M
MaxFileSize 4000M
MaxScanSize 4000M
MaxScanTime 300000
MaxRecursion 16
MaxFiles 50000

# Archive bombs: keep the ratio guard, it is about nesting, not size.
MaxEmbeddedPE 4000M
MaxHTMLNormalize 100M
MaxHTMLNoTags 20M
MaxScriptNormalize 20M
MaxZipTypeRcg 4000M
MaxPartitions 128
MaxIconsPE 200

# A single large stream can take a while to push over the socket.
ReadTimeout 300
CommandReadTimeout 60
MaxThreads 20
MaxQueue 200
